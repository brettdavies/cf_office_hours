# Caller for the centralized guard-main-provenance reusable workflow.
# Verifies that every commit in a PR to main carries a `(#N)` squash-merge
# reference from a PR to dev, or uses one of the exempt housekeeping prefixes
# (docs, chore, ci, style, build). Skipped for `release/*` heads, where the
# release PR itself is the review gate.
#
# The job key must be `guard-provenance` so the status check context is
# `guard-provenance / check-provenance`.
name: Guard main commit provenance

on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: read

jobs:
  guard-provenance:
    uses: brettdavies/.github/.github/workflows/guard-main-provenance.yml@main

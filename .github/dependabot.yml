version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Chicago
    cooldown:
      default-days: 7
    target-branch: dev
    open-pull-requests-limit: 10
    # In-range updates only (minor/patch); majors are handled deliberately, not by Dependabot.
    versioning-strategy: lockfile-only
    labels:
      - dependencies
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    # The Playwright family (@playwright/*, playwright, playwright-core) is
    # exact-pinned to the version dotfiles provisions into
    # $PLAYWRIGHT_BROWSERS_PATH, so bumping it is a dotfiles job, not a
    # per-repo one: a client ahead of the provisioned browsers fails e2e.
    # No `update-types` here, so every version update is suppressed rather
    # than majors alone.
    ignore:
      - dependency-name: '@playwright/*'
      - dependency-name: 'playwright'
      - dependency-name: 'playwright-core'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Chicago
    cooldown:
      default-days: 7
    target-branch: dev
    labels:
      - dependencies
      - github-actions
